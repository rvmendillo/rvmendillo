name: ReyLab
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ReyLab:
    type: application
    platform: iOS
    sources: [ReyLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reylab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rey Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your converted ASCII videos to Photos.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [ReyLabTests]
  ReyLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReyLabTests]
    dependencies:
      - target: ReyLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reylab.tests
        GENERATE_INFOPLIST_FILE: YES
