name: Build NEXUS IPA
on:
  push:
    branches: ["feature/personal-nexus-ios-build"]
    paths:
      - "nexus_project.tar.gz.b64"
      - ".github/workflows/build-nexus.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore NEXUS source
        run: |
          python3 - <<'PY'
          import base64, pathlib, xml.etree.ElementTree as ET
          src = pathlib.Path('nexus_project.tar.gz.b64').read_text().strip()
          pathlib.Path('nexus_project.tar.gz').write_bytes(base64.b64decode(src))
          PY
          tar -xzf nexus_project.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('PersonalNexus/Resources/LaunchScreen.storyboard')
          s = p.read_text()
          s = s.replace('<userDefinedRuntimeAttributes><userDefinedRuntimeAttribute type="number" keyPath="layer.cornerRadius"><real key="value" value="28"/></userDefinedRuntimeAttribute></userDefinedRuntimeAttributes>', '')
          p.write_text(s)
          ET.parse(p)
          assert 'userDefinedRuntime' not in s
          print('Launch screen sanitized for iOS launch-screen rules')
          PY
      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Generate app icon
        run: python3 PersonalNexus/scripts/make_icons.py
      - name: Generate Xcode project
        run: cd PersonalNexus && xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PersonalNexus/NEXUS.xcodeproj \
            -scheme NEXUS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NEXUS.app Payload/
          /usr/bin/zip -qry NEXUS-1.7.2-build11-unsigned.ipa Payload
          shasum -a 256 NEXUS-1.7.2-build11-unsigned.ipa | tee NEXUS-1.7.2-build11-unsigned.sha256
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/NEXUS.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/NEXUS.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/NEXUS.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.7.2-build11-unsigned
          path: |
            NEXUS-1.7.2-build11-unsigned.ipa
            NEXUS-1.7.2-build11-unsigned.sha256
          if-no-files-found: error
          retention-days: 30
