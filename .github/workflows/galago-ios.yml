name: GalaGo iPhone IPA
on:
  push:
    branches: ['codex/galago-*']
    paths: ['GalaGo/**', '.github/workflows/galago-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galago-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test trip totals, vouchers and search resilience
        working-directory: GalaGo
        run: |
          swift test
          node scripts/test-capture.cjs
          node scripts/test-readiness.cjs
      - name: Generate Xcode project and branded icon
        run: |
          python3 GalaGo/scripts/generate_project.py
          swift GalaGo/scripts/icon.swift GalaGo/Resources/Assets.xcassets/AppIcon.appiconset
      - name: Build real arm64 iPhone app
        run: |
          set -o pipefail
          xcodebuild -project GalaGo/GalaGo.xcodeproj -scheme GalaGo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/device/Build/Products/Release-iphoneos/GalaGo.app dist/Payload/
          cd dist
          zip -qr GalaGo-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 GalaGo-unsigned.ipa > SHA256.txt
      - name: Upload installable app package
        uses: actions/upload-artifact@v4
        with:
          name: GalaGo-IPA
          path: |
            dist/GalaGo-unsigned.ipa
            dist/SHA256.txt
          retention-days: 30
      - name: Build and launch in iPhone simulator
        timeout-minutes: 7
        run: |
          set -o pipefail
          xcodebuild -project GalaGo/GalaGo.xcodeproj -scheme GalaGo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" build 2>&1 | tee build-simulator.log
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/GalaGo.app
          xcrun simctl launch "$DEVICE" com.rvmendillo.galago
          sleep 5
          xcrun simctl io "$DEVICE" screenshot dist/GalaGo-discover.png
          xcrun simctl terminate "$DEVICE" com.rvmendillo.galago
          xcrun simctl launch "$DEVICE" com.rvmendillo.galago --demo
          sleep 3
          xcrun simctl io "$DEVICE" screenshot dist/GalaGo-compare.png
          xcrun simctl terminate "$DEVICE" com.rvmendillo.galago
          xcrun simctl launch "$DEVICE" com.rvmendillo.galago --demo --prices
          sleep 3
          xcrun simctl io "$DEVICE" screenshot dist/GalaGo-prices.png
          xcrun simctl terminate "$DEVICE" com.rvmendillo.galago
          xcrun simctl launch "$DEVICE" com.rvmendillo.galago --codes
          sleep 3
          xcrun simctl io "$DEVICE" screenshot dist/GalaGo-codes.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GalaGo-iPhone
          path: |
            dist/*
            build-device.log
            build-simulator.log
          if-no-files-found: error
          retention-days: 30
